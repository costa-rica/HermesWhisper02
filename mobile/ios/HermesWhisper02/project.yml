name: HermesWhisper02
options:
  bundleIdPrefix: com.dashanddata
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HermesWhisper02:
    type: application
    platform: iOS
    sources:
      - HermesWhisper02
    settings:
      base:
        DEVELOPMENT_TEAM: GL5QL25H5M
        PRODUCT_BUNDLE_IDENTIFIER: com.dashanddata.hermeswhisper02
        INFOPLIST_FILE: HermesWhisper02/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: HermesWhisper02/Info.plist
      properties:
        CFBundleDisplayName: HermesWhisper02
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: HermesWhisper needs the microphone to capture your voice.
        NSLocalNetworkUsageDescription: HermesWhisper connects to a local development API while testing on your network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - HermesWhisper02Tests
    dependencies:
      - sdk: libsqlite3.tbd
  HermesWhisper02Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HermesWhisper02Tests
    dependencies:
      - target: HermesWhisper02
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dashanddata.hermeswhisper02.tests
        GENERATE_INFOPLIST_FILE: YES
  HermesWhisper02UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HermesWhisper02UITests
    dependencies:
      - target: HermesWhisper02
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dashanddata.hermeswhisper02.uitests
        GENERATE_INFOPLIST_FILE: YES
