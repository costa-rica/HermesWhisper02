[project]
name = "hermes-whisper-02-api"
version = "0.1.0"
description = "FastAPI and Pipecat backend for HermesWhisper02."
readme = "README.md"
authors = [{ name = "Dash and Data", email = "nrodrig1@gmail.com" }]
requires-python = ">=3.12, <3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "email-validator>=2.3.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pipecat-ai[openai,silero]~=0.0.108",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.28",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx[asgi]>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests that call external services",
]

[tool.uv]
package = false
